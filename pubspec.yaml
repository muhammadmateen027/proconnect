name: proconnect
description: A multi-tenant property management system for Malaysian condominiums. 
  Features integrated visitor management for security agencies and premium 
  tenancy tools for unit owners.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  # Backend
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1

  # DI
  kiwi: ^4.1.0

  # Data Modeling
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.2.1

  # Navigation
  go_router: ^17.0.1

  # UI
  google_fonts: ^7.0.2
  font_awesome_flutter: ^10.12.0
  flex_color_scheme: ^8.4.0

  # Local Storage
  shared_preferences: ^2.2.2

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  bloc_test: ^10.0.0
  flutter_test: 
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
